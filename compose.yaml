# Docker Compose for VK Portfolio - Synology NAS / Docker deployment
# SQLite edition — single container, no separate database server.
# Set environment variables in Dockhand's stack "Environment" tab.
# Docker image is built automatically via GitHub Actions on every push to main.

services:

  portfolio-web:
    image: ghcr.io/vinamrak17/vk-website-claude:latest
    pull_policy: always
    environment:
      - DATABASE_URL=file:/app/data/portfolio.db
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - CONTACT_PHONE=${CONTACT_PHONE}
      # Optional SMTP — leave unset to use Google fallback
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    ports:
      - "3000:3000"
    volumes:
      - portfolio-data:/app/data   # SQLite DB persists here across restarts
    restart: always

volumes:
  portfolio-data:   # Docker-managed volume on the NAS
