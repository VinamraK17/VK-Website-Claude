services:

  portfolio-web:
    image: ghcr.io/vinamrak17/vk-website-claude:latest
    pull_policy: always
    environment:
      - DATABASE_URL=file:/app/data/portfolio.db
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - CONTACT_PHONE=${CONTACT_PHONE}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    ports:
      - "3000:3000"
    volumes:
      - portfolio-data:/app/data
    restart: always

volumes:
  portfolio-data: